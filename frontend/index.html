<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF RAG Highlighter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- Header ---- */
    header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      color: white;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    header .logo { font-size: 20px; }
    header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
    header .tag {
      font-size: 11px;
      background: rgba(255,255,255,0.15);
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 4px;
    }

    /* ---- Main layout ---- */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ---- PDF viewer (left) ---- */
    .pdf-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #404040;
      min-width: 0;
    }

    .pdf-toolbar {
      background: #2d2d2d;
      color: #e0e0e0;
      padding: 0 14px;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      flex-shrink: 0;
      user-select: none;
    }
    .pdf-toolbar .nav-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pdf-toolbar .nav-btn:hover { background: rgba(255,255,255,0.2); }
    .pdf-toolbar .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .pdf-toolbar .page-info { display: flex; align-items: center; gap: 6px; }
    .pdf-toolbar input[type=number] {
      width: 44px;
      text-align: center;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 3px 4px;
      border-radius: 4px;
      font-size: 13px;
      -moz-appearance: textfield;
    }
    .pdf-toolbar input[type=number]::-webkit-outer-spin-button,
    .pdf-toolbar input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    #pdf-filename-label {
      margin-left: auto;
      font-size: 12px;
      opacity: 0.55;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .zoom-btns { display: flex; gap: 4px; margin-left: 12px; }

    .pdf-viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* Canvas + overlay wrapper */
    #pdf-container {
      position: relative;
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 6px 30px rgba(0,0,0,0.5);
    }
    #pdf-canvas { display: block; }

    /* Highlight overlay — sits exactly on top of canvas */
    #highlight-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .h-box {
      position: absolute;
      background: rgba(255, 214, 0, 0.30);
      border: 2px solid rgba(255, 160, 0, 0.75);
      border-radius: 2px;
    }
    .h-box.h-active {
      background: rgba(255, 120, 0, 0.42);
      border-color: rgba(220, 60, 0, 0.9);
    }

    /* Empty canvas placeholder */
    #pdf-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: rgba(255,255,255,0.3);
      font-size: 14px;
      width: 640px;
      height: 860px;
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: 4px;
    }
    #pdf-placeholder .big-icon { font-size: 48px; }

    /* ---- Control panel (right) ---- */
    .ctrl-panel {
      width: 360px;
      flex-shrink: 0;
      background: white;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #e2e8f0;
      overflow: hidden;
    }

    .section {
      padding: 16px;
      border-bottom: 1px solid #f1f5f9;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    /* Upload */
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: #6366f1;
      background: #f5f3ff;
    }
    .upload-area .uicon { font-size: 28px; margin-bottom: 6px; }
    .upload-area strong { font-size: 13px; color: #334155; }
    .upload-area p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    input[type=file] { display: none; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 10px;
    }
    .badge-loading { background: #fef9c3; color: #854d0e; }
    .badge-ok      { background: #dcfce7; color: #166534; }
    .badge-err     { background: #fee2e2; color: #991b1b; }

    #md-btn {
      display: none;
      margin-top: 8px;
      width: 100%;
      padding: 7px 0;
      border: 1.5px solid #6366f1;
      border-radius: 8px;
      background: transparent;
      color: #6366f1;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #md-btn:hover { background: #6366f1; color: #fff; }

    /* Query */
    .query-row { display: flex; gap: 8px; }
    #q-input {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #q-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    #search-btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #search-btn:hover:not(:disabled) { background: #4f46e5; }
    #search-btn:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Results */
    .results-list { flex: 1; overflow-y: auto; padding: 12px 16px 16px; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 40px 20px;
      color: #94a3b8;
    }
    .empty-state .eicon { font-size: 36px; }
    .empty-state p { font-size: 13px; text-align: center; line-height: 1.5; }

    .result-card {
      padding: 11px 13px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .result-card:hover { border-color: #a5b4fc; background: #fafafa; }
    .result-card.active { border-color: #6366f1; background: #eef2ff; }
    .result-card:active { transform: scale(0.99); }

    .result-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .page-chip {
      font-size: 11px;
      font-weight: 700;
      color: #6366f1;
      background: #eef2ff;
      padding: 2px 9px;
      border-radius: 20px;
    }
    .score-chip { font-size: 11px; color: #94a3b8; }

    .result-snippet {
      font-size: 13px;
      color: #475569;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 11px; height: 11px;
      border: 2px solid rgba(0,0,0,0.15);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <span class="logo">📄</span>
  <h1>PDF RAG Highlighter</h1>
  <span class="tag">Azure Layout + BM25</span>
</header>

<div class="main">

  <!-- ======== PDF Viewer ======== -->
  <div class="pdf-panel">
    <div class="pdf-toolbar">
      <button class="nav-btn" id="btn-prev" title="上一页" onclick="changePage(-1)" disabled>&#9664;</button>
      <div class="page-info">
        第&nbsp;<input type="number" id="page-num" value="1" min="1"
          onchange="goToPage(parseInt(this.value))">&nbsp;/&nbsp;<span id="page-total">—</span>&nbsp;页
      </div>
      <button class="nav-btn" id="btn-next" title="下一页" onclick="changePage(1)" disabled>&#9654;</button>
      <div class="zoom-btns">
        <button class="nav-btn" title="缩小" onclick="zoom(-0.2)">−</button>
        <button class="nav-btn" title="放大" onclick="zoom(+0.2)">+</button>
        <button class="nav-btn" title="适应宽度" onclick="fitWidth()">⊡</button>
      </div>
      <span id="pdf-filename-label">未加载文档</span>
    </div>

    <div class="pdf-viewport" id="pdf-viewport">
      <div id="pdf-placeholder">
        <div class="big-icon">📑</div>
        <span>上传 PDF 后在此预览</span>
      </div>
      <div id="pdf-container" style="display:none">
        <canvas id="pdf-canvas"></canvas>
        <div id="highlight-overlay"></div>
      </div>
    </div>
  </div>

  <!-- ======== Control Panel ======== -->
  <div class="ctrl-panel">

    <!-- Upload -->
    <div class="section">
      <div class="section-title">文档上传</div>
      <div class="upload-area" id="upload-area"
        onclick="document.getElementById('file-input').click()"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event)">
        <div class="uicon">📂</div>
        <strong>点击或拖拽上传 PDF</strong>
        <p>扫描件将自动进行 OCR 识别（Azure Document Intelligence）</p>
      </div>
      <input type="file" id="file-input" accept=".pdf" onchange="doUpload(this.files[0])">
      <div id="upload-status"></div>
      <button id="md-btn" onclick="downloadMarkdown()">⬇ 下载 Markdown</button>
    </div>

    <!-- Query -->
    <div class="section">
      <div class="section-title">语义检索</div>
      <div class="query-row">
        <input type="text" id="q-input" placeholder="输入检索问题或关键词…"
          onkeydown="if(event.key==='Enter') doSearch()">
        <button id="search-btn" onclick="doSearch()" disabled>检索</button>
      </div>
    </div>

    <!-- Results -->
    <div class="results-list" id="results-list">
      <div class="empty-state">
        <div class="eicon">🔎</div>
        <p>上传文档后，<br>在此输入问题即可高亮相关段落</p>
      </div>
    </div>

  </div>
</div>

<!-- pdf.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ── State ──────────────────────────────────────────────────────────────────
  let pdfDoc        = null;
  let currentPage   = 1;
  let currentScale  = null;   // null = fit-width
  let currentFile   = null;   // filename string
  let highlights    = [];     // [{page_idx, bbox, score, text}, ...]
  let activeIdx     = -1;

  // ── Page-load: restore last session from localStorage ──────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    const saved = localStorage.getItem('currentFile');
    if (!saved) return;
    try {
      const res  = await fetch(`/api/status/${encodeURIComponent(saved)}`);
      const data = await res.json();
      if (data.indexed) {
        currentFile = saved;
        disableSearch(false);
        setStatus('ok', `已恢复：${saved}`);
        await loadPDF(`/api/pdf/${encodeURIComponent(saved)}`);
        document.getElementById('pdf-filename-label').textContent = saved;
        if (data.has_markdown) showMdBtn(true);
      }
    } catch (_) { /* server not ready yet, ignore */ }
  });

  // ── Upload ─────────────────────────────────────────────────────────────────
  async function doUpload(file) {
    if (!file) return;
    setStatus('loading', '上传并解析中，请稍候…');
    disableSearch(true);

    const form = new FormData();
    form.append('file', file);

    try {
      const res  = await fetch('/api/upload', { method: 'POST', body: form });
      // #region agent log
      const _clone = res.clone();
      const _txt = await _clone.text();
      fetch('http://127.0.0.1:7754/ingest/1074a86e-f8c4-4106-a01e-73746c0bd6dd', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Debug-Session-Id': '0af642' },
        body: JSON.stringify({
          sessionId: '0af642',
          location: 'index.html:doUpload',
          message: 'upload fetch response',
          hypothesisId: 'C',
          data: {
            status: res.status,
            ok: res.ok,
            contentType: res.headers.get('content-type') || '',
            bodyLen: _txt.length,
            bodyPreview: _txt.slice(0, 240),
          },
          timestamp: Date.now(),
        }),
      }).catch(() => {});
      // #endregion
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '上传失败');

      currentFile = data.filename;
      localStorage.setItem('currentFile', currentFile);
      setStatus('ok', `解析完成 · ${data.chunk_count} 个文本块（${data.mode}）`);
      disableSearch(false);
      if (data.has_markdown) showMdBtn(true);

      await loadPDF(`/api/pdf/${encodeURIComponent(currentFile)}`);
      document.getElementById('pdf-filename-label').textContent = currentFile;

    } catch (e) {
      setStatus('err', e.message);
    }
  }

  function showMdBtn(visible) {
    document.getElementById('md-btn').style.display = visible ? 'block' : 'none';
  }

  async function downloadMarkdown() {
    if (!currentFile) return;
    try {
      const res = await fetch(`/api/markdown/${encodeURIComponent(currentFile)}`);
      if (!res.ok) throw new Error((await res.json()).detail || '下载失败');
      const text = await res.text();
      const stem = currentFile.replace(/\.pdf$/i, '');
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
      a.download = `${stem}.md`;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) {
      setStatus('err', e.message);
    }
  }

  function setStatus(type, msg) {
    const cls = { loading: 'badge-loading', ok: 'badge-ok', err: 'badge-err' }[type];
    const icon = type === 'loading' ? '<span class="spinner"></span>' : '';
    document.getElementById('upload-status').innerHTML =
      `<span class="badge ${cls}">${icon}${esc(msg)}</span>`;
  }

  // ── PDF.js ──────────────────────────────────────────────────────────────────
  async function loadPDF(url) {
    pdfDoc = await pdfjsLib.getDocument(url).promise;
    const total = pdfDoc.numPages;
    document.getElementById('page-total').textContent = total;
    document.getElementById('page-num').max = total;
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = total <= 1;
    document.getElementById('pdf-placeholder').style.display = 'none';
    document.getElementById('pdf-container').style.display  = 'inline-block';

    currentPage  = 1;
    currentScale = null;
    document.getElementById('page-num').value = 1;
    await renderPage(1);
  }

  async function renderPage(pageNum) {
    if (!pdfDoc) return;
    const page     = await pdfDoc.getPage(pageNum);
    const viewport = buildViewport(page);

    const canvas = document.getElementById('pdf-canvas');
    const dpr    = window.devicePixelRatio || 1;
    canvas.width        = viewport.width  * dpr;
    canvas.height       = viewport.height * dpr;
    canvas.style.width  = viewport.width  + 'px';
    canvas.style.height = viewport.height + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    await page.render({ canvasContext: ctx, viewport }).promise;

    drawHighlights(pageNum - 1, viewport.width, viewport.height);
    syncNavButtons();
  }

  function buildViewport(page) {
    const maxW = document.getElementById('pdf-viewport').clientWidth - 40;
    const scale = currentScale ?? (maxW / page.getViewport({ scale: 1 }).width);
    return page.getViewport({ scale });
  }

  function zoom(delta) {
    if (!pdfDoc) return;
    pdfDoc.getPage(currentPage).then(page => {
      const base = currentScale ?? (
        (document.getElementById('pdf-viewport').clientWidth - 40)
        / page.getViewport({ scale: 1 }).width
      );
      currentScale = Math.max(0.3, Math.min(4, base + delta));
      renderPage(currentPage);
    });
  }

  function fitWidth() {
    currentScale = null;
    renderPage(currentPage);
  }

  function changePage(delta) {
    goToPage(currentPage + delta);
  }

  async function goToPage(n) {
    if (!pdfDoc) return;
    n = Math.max(1, Math.min(pdfDoc.numPages, n));
    currentPage = n;
    document.getElementById('page-num').value = n;
    await renderPage(n);
  }

  function syncNavButtons() {
    document.getElementById('btn-prev').disabled = currentPage <= 1;
    document.getElementById('btn-next').disabled = !pdfDoc || currentPage >= pdfDoc.numPages;
  }

  // ── Highlight overlay ───────────────────────────────────────────────────────
  function drawHighlights(pageIdx, cssW, cssH) {
    const overlay = document.getElementById('highlight-overlay');
    overlay.innerHTML = '';

    highlights.forEach((h, i) => {
      if (h.page_idx !== pageIdx || !h.bbox) return;
      const [x0, y0, x1, y1] = h.bbox;
      const div = document.createElement('div');
      div.className = 'h-box' + (i === activeIdx ? ' h-active' : '');
      div.style.left   = (x0 / 1000 * cssW) + 'px';
      div.style.top    = (y0 / 1000 * cssH) + 'px';
      div.style.width  = ((x1 - x0) / 1000 * cssW) + 'px';
      div.style.height = ((y1 - y0) / 1000 * cssH) + 'px';
      overlay.appendChild(div);
    });
  }

  // ── Search ──────────────────────────────────────────────────────────────────
  async function doSearch() {
    const q = document.getElementById('q-input').value.trim();
    if (!q || !currentFile) return;

    const btn = document.getElementById('search-btn');
    btn.disabled = true;
    btn.textContent = '检索中…';

    try {
      const res  = await fetch('/api/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: currentFile, query: q, top_k: 5 }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail);

      highlights = data.results;
      activeIdx  = -1;
      renderResults(data.results);
      if (data.results.length > 0) selectResult(0);

    } catch (e) {
      document.getElementById('results-list').innerHTML =
        `<div class="empty-state"><div class="eicon">⚠️</div><p>${esc(e.message)}</p></div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = '检索';
    }
  }

  function renderResults(results) {
    const list = document.getElementById('results-list');
    if (!results.length) {
      list.innerHTML = '<div class="empty-state"><div class="eicon">🔍</div><p>未找到相关内容</p></div>';
      return;
    }
    list.innerHTML = results.map((r, i) => `
      <div class="result-card" id="rc-${i}" onclick="selectResult(${i})">
        <div class="result-meta">
          <span class="page-chip">第 ${r.page_idx + 1} 页</span>
          <span class="score-chip">相关度 ${r.score.toFixed(2)}</span>
        </div>
        <div class="result-snippet">${esc(r.text)}</div>
      </div>
    `).join('');
  }

  async function selectResult(i) {
    activeIdx = i;
    document.querySelectorAll('.result-card').forEach((el, j) =>
      el.classList.toggle('active', j === i)
    );
    // goToPage → renderPage → drawHighlights, which uses activeIdx for the orange box
    await goToPage(highlights[i].page_idx + 1);
  }

  // ── Drag & drop ────────────────────────────────────────────────────────────
  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('upload-area').classList.add('dragover');
  }
  function onDragLeave() {
    document.getElementById('upload-area').classList.remove('dragover');
  }
  function onDrop(e) {
    e.preventDefault();
    document.getElementById('upload-area').classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f?.name.toLowerCase().endsWith('.pdf')) doUpload(f);
  }

  function disableSearch(val) {
    document.getElementById('search-btn').disabled = val;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // Re-render on window resize
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (pdfDoc) renderPage(currentPage); }, 150);
  });
</script>
</body>
</html>
